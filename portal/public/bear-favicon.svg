<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="favBg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#be185d" />
      <stop offset="50%" stop-color="#db2777" />
      <stop offset="100%" stop-color="#831843" />
    </linearGradient>
    <linearGradient id="favSnout" x1="32" y1="32" x2="32" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fff1f2" />
      <stop offset="100%" stop-color="#fed7aa" />
    </linearGradient>
  </defs>

  <!-- Squircle container -->
  <rect width="64" height="64" rx="16" fill="url(#favBg)"/>

  <!-- Ears -->
  <circle cx="18" cy="18" r="10" fill="#f43f5e"/>
  <circle cx="18" cy="18" r="5" fill="#fce7f3"/>
  <circle cx="46" cy="18" r="10" fill="#f43f5e"/>
  <circle cx="46" cy="18" r="5" fill="#fce7f3"/>

  <!-- Head -->
  <circle cx="32" cy="35" r="23" fill="#db2777"/>

  <!-- Eyebrows -->
  <path d="M20 23 Q24 21 28 24" stroke="#831843" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <path d="M44 23 Q40 21 36 24" stroke="#831843" stroke-width="2.5" stroke-linecap="round" fill="none"/>

  <!-- Eyes -->
  <circle cx="23.5" cy="30" r="3.5" fill="#18181b"/>
  <circle cx="22.5" cy="28.8" r="1.2" fill="#ffffff"/>
  <circle cx="40.5" cy="30" r="3.5" fill="#18181b"/>
  <circle cx="39.5" cy="28.8" r="1.2" fill="#ffffff"/>

  <!-- Cheeks -->
  <circle cx="15" cy="38" r="4" fill="#fb7185" opacity="0.6"/>
  <circle cx="49" cy="38" r="4" fill="#fb7185" opacity="0.6"/>

  <!-- Snout -->
  <ellipse cx="32" cy="41" rx="14" ry="11" fill="url(#favSnout)" stroke="#fbcfe8" stroke-width="1"/>

  <!-- Nose -->
  <ellipse cx="32" cy="37.5" rx="5.5" ry="4" fill="#701a75"/>
  <circle cx="31" cy="36.5" r="1" fill="#e879f9" opacity="0.5"/>

  <!-- Smile -->
  <path d="M26 44 Q32 49 38 44" stroke="#701a75" stroke-width="2" stroke-linecap="round" fill="none"/>
</svg>
