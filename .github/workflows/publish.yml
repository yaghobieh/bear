name: Publish to npm

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Ensure Rollup Linux optional dependency
        run: |
          ROLLUP_VERSION=$(node -p "require('./node_modules/rollup/package.json').version")
          npm install --no-save "@rollup/rollup-linux-x64-gnu@${ROLLUP_VERSION}"

      - name: Build library
        run: npm run build

      - name: Publish to npm
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "@forgedevstack/bear@${VERSION}" version >/dev/null 2>&1; then
            echo "@forgedevstack/bear@${VERSION} is already on npm"
          else
            npm publish --access public --provenance
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish Bear Grid and Blocks
        run: |
          npm run build --prefix packages/bear-grid
          npm run build --prefix packages/bear-blocks
          publish_if_new() {
            local dir="$1"
            local name version
            name=$(node -p "require('./${dir}/package.json').name")
            version=$(node -p "require('./${dir}/package.json').version")
            if npm view "${name}@${version}" version >/dev/null 2>&1; then
              echo "${name}@${version} is already on npm"
            else
              npm --prefix "$dir" publish --access public --provenance
            fi
          }
          publish_if_new packages/bear-grid
          publish_if_new packages/bear-blocks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  portal:
    needs: publish
    runs-on: ubuntu-latest
    if: success()
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install & build Bear
        run: |
          npm ci
          ROLLUP_VERSION=$(node -p "require('./node_modules/rollup/package.json').version")
          npm install --no-save "@rollup/rollup-linux-x64-gnu@${ROLLUP_VERSION}"
          npm run build

      - name: Install & build portal
        run: npm run portal:install && npm run portal:build
