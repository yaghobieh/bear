name: Publish to npm

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Ensure Rollup Linux optional dependency
        run: |
          ROLLUP_VERSION=$(node -p "require('./node_modules/rollup/package.json').version")
          npm install --no-save "@rollup/rollup-linux-x64-gnu@${ROLLUP_VERSION}"

      - name: Build library
        run: npm run build

      - name: Publish to npm
        run: |
          set +e
          out=$(npm publish --access public --provenance 2>&1)
          code=$?
          set -e
          echo "$out"
          if [ "$code" -ne 0 ]; then
            echo "$out" | grep -q "previously staged version\|You cannot publish over the previously published versions" || exit "$code"
            echo "Bear 1.3.6 is already published."
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish Bear Grid and Blocks
        run: |
          npm run build --prefix packages/bear-grid
          npm run build --prefix packages/bear-blocks
          node --input-type=module <<'EOF'
          import { readFileSync, writeFileSync } from 'node:fs';
          for (const dir of ['packages/bear-grid', 'packages/bear-blocks']) {
            const file = `${dir}/package.json`;
            const pkg = JSON.parse(readFileSync(file, 'utf8'));
            const pub = pkg.publishConfig;
            pkg.main = pub.main;
            pkg.module = pub.module;
            pkg.types = pub.types;
            pkg.exports = pub.exports;
            writeFileSync(file, `${JSON.stringify(pkg, null, 2)}\n`);
          }
          EOF
          npm publish ./packages/bear-grid --access public --provenance
          npm publish ./packages/bear-blocks --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  portal:
    needs: publish
    runs-on: ubuntu-latest
    if: success()
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install & build Bear
        run: |
          npm ci
          ROLLUP_VERSION=$(node -p "require('./node_modules/rollup/package.json').version")
          npm install --no-save "@rollup/rollup-linux-x64-gnu@${ROLLUP_VERSION}"
          npm run build

      - name: Install & build portal
        run: npm run portal:install && npm run portal:build
