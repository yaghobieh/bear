<svg width="120" height="132" viewBox="0 0 120 132" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="lotsoFur" x1="20" y1="10" x2="100" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="45%" stop-color="#db2777" />
      <stop offset="100%" stop-color="#9d174d" />
    </linearGradient>
    <linearGradient id="lotsoEarInner" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fdf2f8" />
      <stop offset="100%" stop-color="#fbcfe8" />
    </linearGradient>
    <linearGradient id="lotsoSnout" x1="60" y1="65" x2="60" y2="105" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fff1f2" />
      <stop offset="100%" stop-color="#fed7aa" />
    </linearGradient>
    <linearGradient id="lotsoNose" x1="60" y1="72" x2="60" y2="88" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#701a75" />
      <stop offset="100%" stop-color="#4a044e" />
    </linearGradient>
    <filter id="softGlow" x="-10%" y="-10%" width="120%" height="120%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#db2777" flood-opacity="0.25" />
    </filter>
  </defs>

  <g filter="url(#softGlow)">
    <!-- Ears -->
    <ellipse cx="28" cy="30" rx="18" ry="18" fill="url(#lotsoFur)" />
    <ellipse cx="28" cy="30" rx="10" ry="10" fill="url(#lotsoEarInner)" />
    <ellipse cx="92" cy="30" rx="18" ry="18" fill="url(#lotsoFur)" />
    <ellipse cx="92" cy="30" rx="10" ry="10" fill="url(#lotsoEarInner)" />

    <!-- Head -->
    <ellipse cx="60" cy="66" rx="46" ry="43" fill="url(#lotsoFur)" />

    <!-- Brow tufts / Expression marks -->
    <path d="M36 40 Q44 37 50 42" stroke="#831843" stroke-width="3.5" stroke-linecap="round" fill="none" />
    <path d="M84 40 Q76 37 70 42" stroke="#831843" stroke-width="3.5" stroke-linecap="round" fill="none" />

    <!-- Eyes -->
    <ellipse cx="43" cy="52" rx="7" ry="8" fill="#18181b" />
    <ellipse cx="40.5" cy="49" rx="2.5" ry="3" fill="#ffffff" />
    <circle cx="44.5" cy="54.5" r="1.2" fill="#ffffff" />

    <ellipse cx="77" cy="52" rx="7" ry="8" fill="#18181b" />
    <ellipse cx="74.5" cy="49" rx="2.5" ry="3" fill="#ffffff" />
    <circle cx="78.5" cy="54.5" r="1.2" fill="#ffffff" />

    <!-- Rosy Cheeks -->
    <ellipse cx="26" cy="68" rx="8" ry="5" fill="#f43f5e" opacity="0.45" />
    <ellipse cx="94" cy="68" rx="8" ry="5" fill="#f43f5e" opacity="0.45" />

    <!-- Lotso Cream Snout -->
    <ellipse cx="60" cy="80" rx="26" ry="20" fill="url(#lotsoSnout)" stroke="#fbcfe8" stroke-width="1.5" />

    <!-- Plum Nose -->
    <ellipse cx="60" cy="74" rx="10" ry="7" fill="url(#lotsoNose)" />
    <ellipse cx="57.5" cy="72" rx="3.5" ry="2" fill="#d946ef" opacity="0.4" />

    <!-- Smile & Mouth -->
    <path d="M50 85 Q60 93 70 85" stroke="#701a75" stroke-width="3" stroke-linecap="round" fill="none" />
    <path d="M60 81 L60 86" stroke="#701a75" stroke-width="2.5" stroke-linecap="round" />
    <path d="M47 84 Q45 86 46 88" stroke="#701a75" stroke-width="2" stroke-linecap="round" fill="none" />
    <path d="M73 84 Q75 86 74 88" stroke="#701a75" stroke-width="2" stroke-linecap="round" fill="none" />
  </g>
</svg>
